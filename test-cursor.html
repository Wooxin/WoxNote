<div id="pos">Cursor: line ?, col ?</div>

<script type="module">
import {EditorView,keymap,Decoration,DecorationSet,WidgetType} from "https://esm.sh/@codemirror/view@6.35.0";
import {EditorState,RangeSetBuilder,StateField,StateEffect} from "https://esm.sh/@codemirror/state@6.5.0";
import {defaultKeymap,history,historyKeymap} from "https://esm.sh/@codemirror/commands@6.7.1";
import {syntaxHighlighting,syntaxTree} from "https://esm.sh/@codemirror/language@6.10.8";
import {markdown,markdownLanguage} from "https://esm.sh/@codemirror/lang-markdown@6.3.2";
import {HighlightStyle} from "https://esm.sh/@codemirror/language@6.10.8";
import {tags} from "https://esm.sh/@lezer/highlight@1.2.1";
import {closeBrackets} from "https://esm.sh/@codemirror/autocomplete@6.18.4";

// Inline the essential code from decorations.ts (simplified but keeps all widget/replace calls)
let _editorFocused = true;
function setEditorFocused(v) { _editorFocused = v; }
function isEditorFocused() { return _editorFocused; }

function* childrenOf(node) { let child = node.firstChild; while (child) { yield child; child = child.nextSibling; } }

class EmptyWidget extends WidgetType {
  toDOM() { const s = document.createElement("span"); s.style.cssText = "display:inline;font-size:0;line-height:0;color:transparent;user-select:none;pointer-events:none;"; return s; }
  eq() { return true; }
  ignoreEvent() { return true; }
}

// Simplified decorations builder - only includes code that could cause offset
function buildDecorations(state) {
  const b = new RangeSetBuilder();
  const doc = state.doc;
  const sel = state.selection.main;
  const selLineFrom = doc.lineAt(sel.from).from;
  const selLineTo = doc.lineAt(Math.max(sel.from, sel.to)).to;
  const focused = _editorFocused;
  const tree = syntaxTree(state);
  const decos = [];
  
  tree.iterate({
    enter(ref) {
      const node = ref.node, from = node.from, to = node.to, kind = node.name;
      const lineOverlaps = focused && !(to <= selLineFrom || from >= selLineTo);
      
      // Code blocks
      if (kind === "FencedCode" || kind === "CodeBlock") {
        let isOpenFence = true;
        const walk = (n) => {
          for (const child of childrenOf(n)) {
            const cKind = child.name, cFrom = child.from, cTo = child.to;
            if (cKind === "CodeMark") {
              const cmText = doc.sliceString(cFrom, cTo);
              const tickMatch = cmText.match(/^`{3,}|~{3,}/);
              if (tickMatch) {
                const tickLen = tickMatch[0].length;
                const openFlag = isOpenFence; isOpenFence = false;
                if (!lineOverlaps) {
                  if (openFlag) {
                    decos.push({from:cFrom,to:cFrom,deco:Decoration.line({class:"cm-md-fence-open"})});
                    decos.push({from:cFrom,to:cTo,deco:Decoration.replace({widget:new EmptyWidget()})});
                  } else {
                    decos.push({from:cFrom,to:cFrom,deco:Decoration.line({class:"cm-md-fence-close"})});
                    decos.push({from:cFrom,to:cTo,deco:Decoration.replace({widget:new EmptyWidget()})});
                  }
                } else {
                  decos.push({from:cFrom,to:cFrom+tickLen,deco:Decoration.mark({class:"cm-md-marker-edit"})});
                }
              }
            } else if (cKind === "CodeText") {
              const sLine = doc.lineAt(cFrom), eLine = doc.lineAt(Math.max(cFrom,cTo-1));
              for (let i = sLine.number; i <= eLine.number; i++) {
                decos.push({from:doc.line(i).from,to:doc.line(i).from,deco:Decoration.line({class:"cm-md-fenced-line"})});
              }
            }
            walk(child);
          }
        };
        walk(node);
      }
      
      // Blockquote - > hidden unless cursor on line
      else if (kind === "Blockquote") {
        const startLine = doc.lineAt(from), endLine = doc.lineAt(Math.max(from,to-1));
        for (let i = startLine.number; i <= endLine.number; i++) {
          const ln = doc.line(i);
          decos.push({from:ln.from,to:ln.from,deco:Decoration.line({class:"cm-md-blockquote"})});
          const m = ln.text.match(/^((?:\s*>)+)\s?/);
          if (m) {
            const mk = lineOverlaps ? "cm-md-marker-edit" : "cm-md-marker-dim";
            decos.push({from:ln.from,to:ln.from+m[1].length,deco:Decoration.mark({class:mk})});
          }
        }
      }
      
      // HR - hide --- unless cursor on line
      else if (kind === "HorizontalRule") {
        decos.push({from,to:from,deco:Decoration.line({class:"cm-md-hr"})});
        if (!lineOverlaps) {
          decos.push({from,to,deco:Decoration.mark({class:"cm-md-marker-dim"})});
        } else {
          decos.push({from,to,deco:Decoration.mark({class:"cm-md-marker-edit"})});
        }
      }
      
      // Table - line decorations only
      else if (kind === "Table" || kind === "GFMTable") {
        let rowIdx = 0;
        for (const child of childrenOf(node)) {
          const cFrom = child.from, cTo = child.to, cKind = child.name;
          if (cKind === "TableHeader" || cKind === "TableHead") {
            decos.push({from:cFrom,to:cFrom,deco:Decoration.line({class:"cm-md-table-header"})});
          } else if (cKind === "TableDelimiter" || cKind === "TableSeparator") {
            const sepClass = lineOverlaps ? "cm-md-marker-edit" : "cm-md-marker-dim";
            decos.push({from:cFrom,to:cFrom,deco:Decoration.line({class:"cm-md-table-sep-mark"})});
            decos.push({from:cFrom,to:cTo,deco:Decoration.mark({class:sepClass})});
          } else if (cKind === "TableRow") {
            const rowClass = rowIdx % 2 === 0 ? "cm-md-table-row-even" : "cm-md-table-row-odd";
            rowIdx++;
            decos.push({from:cFrom,to:cFrom,deco:Decoration.line({class:rowClass})});
          }
        }
      }
    }
  });
  
  decos.sort((a,b)=>a.from-b.from);
  for (const d of decos) {
    if (d.from >= 0 && d.to <= doc.length && d.from < d.to) b.add(d.from,d.to,d.deco);
    else if (d.from === d.to && d.from >= 0 && d.from <= doc.length) b.add(d.from,d.from,d.deco);
  }
  return b.finish();
}

const focusEffect = StateEffect.define();
const previewField = StateField.define({
  create(s) { return buildDecorations(s); },
  update(decos,tr) {
    if (tr.docChanged || tr.selection || tr.effects.some(e=>e.is(focusEffect)))
      try { return buildDecorations(tr.state); } catch(e) { return decos; }
    return decos;
  },
  provide:f=>EditorView.decorations.from(f)
});
