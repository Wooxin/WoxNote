<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>WoxNote Render Test</title>
<style>
:root {
  --nord0: #2E3440; --nord1: #3B4252; --nord2: #434C5E;
  --nord3: #4C566A; --nord4: #d8dee9; --nord5: #E5E9F0;
  --nord8: #88C0D0; --nord9: #81a1c1; --nord10: #5e81ac;
  --cm-text: var(--nord4);
  --cm-h1-color: #8bbd25; --cm-h2-color: #4caf50;
  --cm-h3-color: #3baea0; --cm-h4-color: #719cd6;
  --cm-h5-color: #9c8aef; --cm-h6-color: #d99aee;
  --cm-bold: var(--nord5); --cm-italic: var(--nord5);
  --cm-code-bg: rgba(59, 66, 82, 0.6); --cm-code-color: var(--nord4);
  --cm-link: var(--nord8); --cm-tag-color: var(--nord8);
  --cm-tag-bg: rgba(136, 192, 208, 0.15);
  --cm-blockquote-border: var(--nord3);
  --cm-blockquote-color: var(--nord4);
  --cm-hr-border: var(--nord2); --cm-table-border: var(--nord2);
  --cm-fenced-bg: rgba(46, 52, 64, 0.6);
  --cm-fenced-border: var(--nord2);
  --cm-activeLine-bg: rgba(216, 222, 233, 0.05);
  --cm-gutter-color: var(--nord3);
  --cm-cursor-color: var(--nord4);
  --cm-selection-bg: rgba(94, 129, 172, 0.35);
  --cm-selectionMatch-bg: rgba(216, 222, 233, 0.06);
  --cm-searchMatch-bg: rgba(235, 203, 139, 0.35);
  --cm-searchMatchSel-bg: rgba(208, 135, 112, 0.45);
  --cm-panel-bg: var(--nord1); --cm-panel-border: var(--nord2);
  --cm-panel-color: var(--nord4); --cm-input-bg: var(--nord0);
  --cm-button-bg: var(--nord2); --cm-button-hover: var(--nord3);
  --cm-highlight-bg: rgba(235, 203, 139, 0.35);
  --cm-highlight-color: var(--nord4);
  --ui-font: "HarmonyOS Sans", Inter, sans-serif;
  --code-font: "Cascadia Code", monospace;
  color: var(--nord4); background: var(--nord0);
}
body { margin: 20px; font-family: var(--ui-font); }
.test-info { margin-bottom: 10px; color: #88C0D0; font-size: 14px; }
#editor { max-width: 900px; margin: 0 auto; height: 600px; border: 1px solid var(--nord2); }
</style></head><body>
<div class="test-info"><strong>WoxNote Render Test</strong> | Focus to see editing mode (cursor line shows raw markdown)</div>
<div id="editor"></div>

<script type="module">
import { EditorView, keymap } from "https://esm.sh/@codemirror/view@6.35.0";
import { EditorState } from "https://esm.sh/@codemirror/state@6.5.0";
import { defaultKeymap, history, historyKeymap } from "https://esm.sh/@codemirror/commands@6.7.1";
import { syntaxHighlighting } from "https://esm.sh/@codemirror/language@6.10.8";
import { markdown, markdownLanguage } from "https://esm.sh/@codemirror/lang-markdown@6.3.2";
import { HighlightStyle } from "https://esm.sh/@codemirror/language@6.10.8";
import { tags } from "https://esm.sh/@lezer/highlight@1.2.1";
import { Decoration, DecorationSet, WidgetType } from "https://esm.sh/@codemirror/view@6.35.0";
import { RangeSetBuilder, StateField, StateEffect } from "https://esm.sh/@codemirror/state@6.5.0";
import { syntaxTree } from "https://esm.sh/@codemirror/language@6.10.8";
import { closeBrackets, autocompletion } from "https://esm.sh/@codemirror/autocomplete@6.18.4";

// Our CSS (from styles.ts)
const CSS = `
.cm-editor { height: 100% !important; }
.cm-scroller { overflow: auto !important; height: 100% !important; }

/* Headings: ZERO underline */
.cm-heading,
.cm-editor .cm-heading,
.cm-editor .cm-line .cm-heading,
.cm-editor .cm-content .cm-heading,
.cm-editor .cm-scroller .cm-heading,
.cm-editor [class*="cm-heading"] {
  text-decoration: none !important;
  border-bottom: none !important;
  text-decoration-line: none !important;
}

.cm-editor .cm-md-heading-text { font-weight: 600; text-decoration: none !important; }
.cm-editor .cm-md-h1 { font-family: var(--ui-font, "HarmonyOS Sans", sans-serif); font-size: 2em; line-height: 1.3; color: var(--cm-h1-color) !important; margin-top: 0.3em; }
.cm-editor .cm-md-h2 { font-family: var(--ui-font, "HarmonyOS Sans", sans-serif); font-size: 1.7em; line-height: 1.3; color: var(--cm-h2-color); margin-top: 0.3em; }
.cm-editor .cm-md-h3 { font-family: var(--ui-font, "HarmonyOS Sans", sans-serif); font-size: 1.5em; line-height: 1.3; color: var(--cm-h3-color); margin-top: 0.2em; }
.cm-editor .cm-md-h4 { font-family: var(--ui-font, "HarmonyOS Sans", sans-serif); font-size: 1.3em; color: var(--cm-h4-color); }
.cm-editor .cm-md-h5 { font-family: var(--ui-font, "HarmonyOS Sans", sans-serif); font-size: 1.1em; color: var(--cm-h5-color); }
.cm-editor .cm-md-h6 { font-family: var(--ui-font, "HarmonyOS Sans", sans-serif); font-size: 1em; color: var(--cm-h6-color); opacity: .85; }

.cm-editor .cm-md-bold { font-weight: 600; color: var(--cm-bold); }
.cm-editor .cm-md-italic { font-style: italic; color: var(--cm-bold); }
.cm-editor .cm-md-strikethrough { text-decoration: line-through; opacity: 0.7; }
.cm-editor .cm-md-code { font-family: var(--code-font,monospace); background: var(--cm-code-bg); padding: 0.1em 0.35em; border-radius: 4px; font-size: .88em; color: var(--cm-code-color); }
.cm-editor .cm-md-link { color: var(--cm-link); text-decoration: none; cursor: pointer; }
.cm-editor .cm-md-link:hover { text-decoration: underline; }
.cm-editor .cm-md-url-hidden { color: transparent !important; font-size: 1px; user-select: none; }
.cm-editor .cm-md-tag { color: var(--cm-tag-color); background: var(--cm-tag-bg); padding: 0 5px; border-radius: 4px; font-size: .9em; cursor: pointer; }
.cm-editor .cm-md-blockquote { border-left: 3px solid var(--cm-blockquote-border); padding-left: 0.75em; opacity: .88; display: inline-block; width: 100%; color: var(--cm-blockquote-color); }
.cm-editor .cm-md-hr { color: transparent !important; border-bottom: 1px solid var(--cm-hr-border); display: block; line-height: 0; margin: 16px 0; }

/* Table */
.cm-line:has(.cm-md-table-header) { background: #434C5E !important; font-weight: 700 !important; }
.cm-line:has(.cm-md-table-row-even) { background: rgba(59, 66, 82, 0.35) !important; }
.cm-line:has(.cm-md-table-row-odd) { background: transparent !important; }
.cm-editor .cm-md-table-sep-mark { opacity: 0.18 !important; font-size: 0.6em; color: #4C566A; }
.cm-editor .cm-md-table-pipe { opacity: 0.18 !important; color: #4C566A; }

.cm-editor .cm-md-task-marker { color: #7eb8ff; }
.cm-editor .cm-md-fenced-line { background: var(--cm-fenced-bg); border-left: 3px solid var(--cm-fenced-border); padding-left: 8px; margin-left: 4px; }

.cm-editor .cm-md-callout { border-radius: 8px; padding: 10px 16px; margin: 6px 0; display: inline-block; width: 100%; border-left: 4px solid; }
.cm-editor .cm-md-callout-note { background: rgba(94, 129, 172, 0.12); border-color: #448aff; color: #b0cfff; }
.cm-editor .cm-md-callout-warning { background: rgba(235, 203, 139, 0.12); border-color: #ffc107; color: #ffe08a; }
.cm-editor .cm-md-callout-danger { background: rgba(191, 97, 106, 0.12); border-color: #ff5252; color: #ffa4a4; }
.cm-editor .cm-md-highlight { background: var(--cm-highlight-bg); padding: 0.05em 0.2em; border-radius: 3px; color: var(--cm-highlight-color); }
.cm-editor .cm-md-underline { text-decoration: underline; text-underline-offset: 3px; }
.cm-editor .cm-md-list-item { display: block; }
.cm-editor .cm-md-marker-dim { opacity: 0.38; color: var(--nord4); }
`;

// Inject CSS
const styleEl = document.createElement("style");
styleEl.id = "cm-md-live-style";
styleEl.textContent = CSS;
document.head.appendChild(styleEl);

// Highlight style
const woxHighlightStyle = HighlightStyle.define([
  { tag: tags.heading, fontWeight: "bold", textDecoration: "none" },
  { tag: tags.heading1, fontWeight: "bold", textDecoration: "none" },
  { tag: tags.heading2, fontWeight: "bold", textDecoration: "none" },
  { tag: tags.heading3, fontWeight: "bold", textDecoration: "none" },
  { tag: tags.heading4, fontWeight: "bold", textDecoration: "none" },
  { tag: tags.heading5, fontWeight: "bold", textDecoration: "none" },
  { tag: tags.heading6, fontWeight: "bold", textDecoration: "none" },
  { tag: tags.emphasis, fontStyle: "italic" },
  { tag: tags.strong, fontWeight: "bold" },
  { tag: tags.strikethrough, textDecoration: "line-through" },
  { tag: tags.keyword, color: "#88C0D0" },
  { tag: [tags.atom, tags.bool, tags.url, tags.labelName, tags.inserted, tags.deleted, tags.literal], color: "#81A1C1" },
  { tag: [tags.string, tags.special(tags.string), tags.regexp, tags.escape], color: "#A3BE8C" },
  { tag: [tags.number, tags.character, tags.unit], color: "#B48EAD" },
  { tag: tags.meta, color: "#5E81AC" },
  { tag: tags.comment, color: "#616E88", fontStyle: "italic" },
  { tag: tags.link, color: "#88C0D0", textDecoration: "underline" },
  { tag: tags.monospace, fontFamily: "var(--code-font, monospace)" },
  { tag: tags.list, color: "#D8DEE9" },
  { tag: tags.quote, color: "#81A1C1" },
  { tag: tags.content, color: "#D8DEE9" },
  { tag: tags.punctuation, color: "#616E88" },
  { tag: tags.processingInstruction, color: "#5E81AC" },
]);

// Theme
const cmTheme = EditorView.theme({
  "&": { height: "100%", fontFamily: "var(--ui-font, HarmonyOS Sans, sans-serif)", backgroundColor: "transparent" },
  ".cm-content": { fontFamily: "var(--ui-font, HarmonyOS Sans, sans-serif)", padding: "32px 64px", fontSize: "16px", lineHeight: "1.5", caretColor: "var(--cm-cursor-color)", color: "var(--cm-text)" },
  ".cm-activeLine": { background: "var(--cm-activeLine-bg)" },
  ".cm-activeLineGutter": { background: "transparent" },
  ".cm-gutters": { border: "none", background: "transparent", color: "var(--cm-gutter-color)", fontSize: "12px", paddingRight: "12px" },
  ".cm-gutterElement": { lineHeight: "1.5" },
  ".cm-cursor": { borderLeftColor: "var(--cm-cursor-color)" },
  "&.cm-focused .cm-selectionBackground,.cm-selectionBackground": { background: "var(--cm-selection-bg) !important" },
  "&.cm-focused": { outline: "none" },
  ".cm-line": { padding: "0 4px", fontFamily: "var(--ui-font, HarmonyOS Sans, sans-serif)" },
});

// Focus state
let _editorFocused = false;

// Build decorations (simplified from decorations.ts)
function childrenOf(node) {
  return {
    *[Symbol.iterator]() {
      let child = node.firstChild;
      while (child) { yield child; child = child.nextSibling; }
    }
  };
}

function buildDecorations(state) {
  if (state.doc.length === 0) return Decoration.none;
  const b = new RangeSetBuilder();
  const sel = state.selection.main;
  const doc = state.doc;
  const selLineFrom = doc.lineAt(sel.from).from;
  const selLineTo = doc.lineAt(Math.max(sel.from, sel.to)).to;
  const decos = [];
  const tableLineRanges = [];

  const tree = syntaxTree(state);
  tree.iterate({
    enter(ref) {
      const node = ref.node;
      const from = node.from, to = node.to, kind = node.name;
      const overlaps = _editorFocused && !(to < selLineFrom || from > selLineTo);

      if (kind.startsWith("Table")) {
        switch (kind) {
          case "Table": break;
          case "TableHeader":
            tableLineRanges.push({ from, to });
            decos.push({ from, to, deco: Decoration.mark({ class: "cm-md-table-header" }) });
            if (!overlaps) {
              const lineText = doc.sliceString(from, to);
              for (let i = 0; i < lineText.length; i++)
                if (lineText[i] === "|") decos.push({ from: from + i, to: from + i + 1, deco: Decoration.mark({ class: "cm-md-table-pipe" }) });
            }
            break;
          case "TableDelimiter":
            tableLineRanges.push({ from, to });
            decos.push({ from, to, deco: Decoration.mark({ class: "cm-md-table-sep-mark" }) });
            break;
          case "TableRow": {
            tableLineRanges.push({ from, to });
            const parent = ref.node.parent;
            let rowIdx = 0;
            if (parent) for (const c of childrenOf(parent)) {
              if (c.name === "TableRow") { if (c.from === from && c.to === to) break; rowIdx++; }
            }
            decos.push({ from, to, deco: Decoration.mark({ class: rowIdx % 2 === 0 ? "cm-md-table-row-even" : "cm-md-table-row-odd" }) });
            if (!(_editorFocused && !(to < selLineFrom || from > selLineTo))) {
              const lineText = doc.sliceString(from, to);
              for (let i = 0; i < lineText.length; i++)
                if (lineText[i] === "|") decos.push({ from: from + i, to: from + i + 1, deco: Decoration.mark({ class: "cm-md-table-pipe" }) });
            }
            break;
          }
        }
        return;
      } else {
        if (kind === "TableCell") return;
      }

      switch (kind) {
        case "ATXHeading1": case "ATXHeading2": case "ATXHeading3":
        case "ATXHeading4": case "ATXHeading5": case "ATXHeading6": {
          const level = parseInt(kind.match(/\d$/)?.[0] || "1") || 1;
          let headerMarkEnd = from;
          for (const c of childrenOf(node)) {
            if (c.name === "HeaderMark") {
              decos.push({ from: c.from, to: c.to, deco: Decoration.mark({ class: overlaps ? "" : "cm-md-marker-dim" }) });
              headerMarkEnd = c.to;
            }
          }
          if (headerMarkEnd < to)
            decos.push({ from: headerMarkEnd, to, deco: Decoration.mark({ class: "cm-md-heading-text cm-md-h" + level }) });
          break;
        }
        case "StrongEmphasis": {
          decos.push({ from: node.from, to: node.to, deco: Decoration.mark({ class: "cm-md-bold" }) });
          for (const c of childrenOf(node))
            if (c.name === "EmphasisMarker" || c.name === "StrongMark")
              decos.push({ from: c.from, to: c.to, deco: Decoration.mark({ class: overlaps ? "" : "cm-md-marker-dim" }) });
          break;
        }
        case "Emphasis": {
          decos.push({ from: node.from, to: node.to, deco: Decoration.mark({ class: "cm-md-italic" }) });
          for (const c of childrenOf(node))
            if (c.name === "EmphasisMarker" || c.name === "StrongMark")
              decos.push({ from: c.from, to: c.to, deco: Decoration.mark({ class: overlaps ? "" : "cm-md-marker-dim" }) });
          break;
        }
        case "Strikethrough":
          decos.push({ from: node.from, to: node.to, deco: Decoration.mark({ class: "cm-md-strikethrough" }) });
          break;
        case "InlineCode":
          decos.push({ from: node.from, to: node.to, deco: Decoration.mark({ class: "cm-md-code" }) });
          break;
        case "FencedCode":
          for (const c of childrenOf(node))
            if (c.name === "FencedCodeBlock")
              decos.push({ from: c.from, to: c.to, deco: Decoration.mark({ class: "cm-md-fenced-line" }) });
          break;
        case "Link": {
          let lt = from, lto = to;
          for (const c of childrenOf(node)) {
            if (c.name === "LinkMark") decos.push({ from: c.from, to: c.to, deco: Decoration.mark({ class: overlaps ? "" : "cm-md-marker-dim" }) });
            if (c.name === "LinkText") { lt = c.from; lto = c.to; }
            if (c.name === "URL") decos.push({ from: c.from, to: c.to, deco: Decoration.mark({ class: overlaps ? "" : "cm-md-url-hidden" }) });
          }
          if (lt < lto) decos.push({ from: lt, to: lto, deco: Decoration.mark({ class: "cm-md-link" }) });
          break;
        }
        case "Blockquote":
          decos.push({ from: node.from, to: node.to, deco: Decoration.mark({ class: "cm-md-blockquote" }) });
          break;
        case "HorizontalRule":
          decos.push({ from: node.from, to: node.to, deco: Decoration.mark({ class: "cm-md-hr" }) });
          break;
      }
    },
  });

  // Line-by-line
  for (let i = 1; i <= doc.lines; i++) {
    const line = doc.line(i), text = line.text;
    const lineOverlaps = _editorFocused && !(line.to < selLineFrom || line.from > selLineTo);
    let isTableLine = false;
    for (const r of tableLineRanges) { if (line.from >= r.from && line.to <= r.to) { isTableLine = true; break; } }
    if (isTableLine) continue;

    for (const m of text.matchAll(/\*\*([^*]+)\*\*/g)) {
      const from = line.from + m.index, to = from + m[0].length;
      const mk = lineOverlaps ? "" : "cm-md-marker-dim";
      decos.push({ from, to: from + 2, deco: Decoration.mark({ class: mk }) });
      decos.push({ from: from + 2, to: to - 2, deco: Decoration.mark({ class: "cm-md-bold" }) });
      decos.push({ from: to - 2, to, deco: Decoration.mark({ class: mk }) });
    }
    for (const m of text.matchAll(/(?<!\*)\*([^*\n]+)\*(?!\*)/g)) {
      const from = line.from + m.index, to = from + m[0].length;
      const mk = lineOverlaps ? "" : "cm-md-marker-dim";
      decos.push({ from, to: from + 1, deco: Decoration.mark({ class: mk }) });
      decos.push({ from: from + 1, to: to - 1, deco: Decoration.mark({ class: "cm-md-italic" }) });
      decos.push({ from: to - 1, to, deco: Decoration.mark({ class: mk }) });
    }
    for (const m of text.matchAll(/`([^`]+)`/g)) {
      const from = line.from + m.index, to = from + m[0].length;
      const mk = lineOverlaps ? "" : "cm-md-marker-dim";
      decos.push({ from, to: from + 1, deco: Decoration.mark({ class: mk }) });
      decos.push({ from: from + 1, to: to - 1, deco: Decoration.mark({ class: "cm-md-code" }) });
      decos.push({ from: to - 1, to, deco: Decoration.mark({ class: mk }) });
    }
    const listMatch = text.match(/^(\s*)([-*+]|\d+[.)])\s/);
    if (listMatch) {
      const mf = line.from + listMatch[1].length;
      decos.push({ from: mf, to: mf + listMatch[2].length, deco: Decoration.mark({ class: lineOverlaps ? "" : "cm-md-marker-dim" }) });
    }
  }

  // Wiki links
  for (let i = 1; i <= doc.lines; i++) {
    const line = doc.line(i), text = line.text;
    for (const m of text.matchAll(/\[\[([^\]]+)\]\]/g)) {
      const from = line.from + m.index, to = from + m[0].length;
      const rOverlaps = _editorFocused && !(to < selLineFrom || from > selLineTo);
      const mk = rOverlaps ? "" : "cm-md-marker-dim";
      decos.push({ from, to: from + 2, deco: Decoration.mark({ class: mk }) });
      decos.push({ from: from + 2, to: to - 2, deco: Decoration.mark({ class: "cm-md-link" }) });
      decos.push({ from: to - 2, to, deco: Decoration.mark({ class: mk }) });
    }
  }

  decos.sort((a, b) => {
    if (a.from !== b.from) return a.from - b.from;
    const sa = a.deco.startSide ?? 0, sb = b.deco.startSide ?? 0;
    if (sa !== sb) return sa - sb;
    if (a.to !== b.to) return b.to - a.to;
    return 0;
  });
  for (const d of decos) {
    if (d.from < d.to && d.from >= 0 && d.to <= doc.length)
      b.add(d.from, d.to, d.deco);
  }
  return b.finish();
}

// Focus effect
const focusEffect = StateEffect.define();

// State field
const previewField = StateField.define({
  create(state) { return buildDecorations(state); },
  update(decos, tr) {
    if (tr.docChanged || tr.selection || tr.effects.some(e => e.is(focusEffect))) {
      try { return buildDecorations(tr.state); } catch(e) { return decos; }
    }
    return decos;
  },
  provide: f => EditorView.decorations.from(f),
});

// Test content
const content = `# Heading 1
## Heading 2
### Heading 3
#### Heading 4
##### Heading 5
###### Heading 6

This is normal paragraph text with **bold** and *italic* and \`inline code\` and ~~strikethrough~~.

Here is a [link](https://example.com).

> This is a blockquote.

---

| Header 1 | Header 2 | Header 3 |
| --- | --- | --- |
| Row 1 | Data A | Data B |
| Row 2 | Data C | Data D |
| Row 3 | Data E | Data F |

- List item 1
- List item 2
- List item 3

- [x] Done task
- [ ] Pending task

\`\`\`python
def hello():
    print("Hello World")
\`\`\`

[[Linked Note]]
`;

// Create editor
const view = new EditorView({
  state: EditorState.create({
    doc: content,
    extensions: [
      previewField,
      cmTheme,
      history(),
      markdown({ base: markdownLanguage }),
      syntaxHighlighting(woxHighlightStyle, { fallback: true }),
      EditorView.lineWrapping,
      closeBrackets(),
      keymap.of([...defaultKeymap, ...historyKeymap]),
      EditorView.domEventHandlers({
        focus: (e, v) => { _editorFocused = true; v.dispatch({ effects: focusEffect.of(true) }); },
        blur: (e, v) => { _editorFocused = false; v.dispatch({ effects: focusEffect.of(false) }); },
      }),
    ]
  }),
  parent: document.getElementById("editor"),
});

// Log state
console.log("Editor created. Focus the editor to see editing mode.");
console.log("Cursor line should show raw markdown (#, **, etc.)");
console.log("Other lines should show rendered appearance.");
</script>
</body></html>
